# Streamlit Cloud Secrets Configuration
# =========================================
# In Streamlit Community Cloud, go to:
#   App → ⋮ Menu → Settings → Secrets
# and paste the following (without these comment lines):
#
# [groq]
# GROQ_API_KEY = "gsk_your_actual_groq_api_key_here"
# GROQ_MODEL = "openai/gpt-oss-120b"
#
# Then redeploy / reboot your app.
# The app reads these via st.secrets["groq"]["GROQ_API_KEY"]
# =========================================
